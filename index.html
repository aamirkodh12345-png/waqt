<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JNNH – Gebetszeiten für dich und drei Freunde</title>
<meta name="theme-color" content="#0B1530">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="preload" href="assets/fonts/anybody-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/video/night.jpg" as="image">

<!-- Firebase-Version an EINER Stelle: die Nummer aus dem CDN-Snippet deiner Firebase-Konsole übernehmen -->
<script type="importmap">
{ "imports": {
  "firebase/app": "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js",
  "firebase/auth": "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js",
  "firebase/firestore": "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js"
} }
</script>

<style>
/* ── Schriften: liegen im Ordner assets/fonts (kein Google-Aufruf, funktioniert offline) ── */
@font-face{font-family:"Anybody";src:url(assets/fonts/anybody-var.woff2) format("woff2");font-weight:100 900;font-stretch:50% 150%;font-display:swap}
@font-face{font-family:"Anybody Outline";src:url(assets/fonts/anybody-outline.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Poppins";src:url(assets/fonts/poppins-200.woff2) format("woff2");font-weight:200;font-display:swap}
@font-face{font-family:"Poppins";src:url(assets/fonts/poppins-300.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Poppins";src:url(assets/fonts/poppins-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Poppins";src:url(assets/fonts/poppins-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Kufi";src:url(assets/fonts/kufi-arabic-var.woff2) format("woff2");font-weight:100 900;
  unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF;font-display:swap}

/* ── Design-Tokens: Blau und warmes Weiß aus dem Poster, dazu Nacht und ein dunkles Blau ── */
:root{
  --ink:#2D54A1;        /* Posterblau (Median der Messung); im Bild immer mit Drucktextur: assets/img/ink.webp */
  --ink-deep:#1B336F;   /* dunkles Blau für Text auf Papier */
  --night:#0B1530;      /* Grund unter den Videos */
  --paper:#E8DAC3;      /* warmes Weiß des Posterpapiers */
  --paper-hi:#F5ECDB;   /* etwas heller für feine Linien und kleine Schrift auf dunklem Grund */
  /* Marvin und Genial sind Lizenzschriften: Dateien nach assets/fonts legen, @font-face ergänzen, hier vorn eintragen */
  --display:"Anybody","Arial Black",sans-serif;
  --outline:"Anybody Outline","Arial Black",sans-serif;   /* nur für Umrissschrift */
  --text:"Poppins",system-ui,sans-serif;
  --ar:"Kufi","Noto Kufi Arabic","Amiri",serif;
  --pad:5vw;
  --veil:.92;           /* Abdunklung über dem Video, wird beim Scrollen gesteuert */
}
*{box-sizing:border-box;margin:0}
html{background:var(--night);color:var(--paper)}
body{font:300 1.0625rem/1.6 var(--text);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--paper-hi);outline-offset:3px}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Hintergrund: Videos fest hinter allem, ein Video aktiv, Blur und Abdunklung steuert fx.js ── */
.bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--night)}
.bg video{position:absolute;left:-5%;top:-5%;width:110%;height:110%;object-fit:cover;opacity:0;transition:opacity 1.4s ease;will-change:filter}
.bg video.on{opacity:1}
#v0{object-position:50% 82%}   /* Nacht-Video: Minarette und Mond bleiben auch im Querformat im Bild */
.veil{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:var(--veil);transition:opacity 1.2s ease;
  background:linear-gradient(180deg,rgba(11,21,48,.74),rgba(14,30,70,.52) 50%,rgba(11,21,48,.8))}
.grain{position:fixed;inset:0;z-index:30;pointer-events:none;background:url(assets/img/grain.webp) 0 0/320px 320px;opacity:.34}

/* ── Bühne: riesiges JNNH, darauf die Uhr ── */
.hero{position:relative;height:100svh;overflow:hidden}
.bar{position:absolute;z-index:3;top:max(2.4svh,env(safe-area-inset-top));left:var(--pad);right:var(--pad);display:flex;align-items:center;gap:.9rem}
.mark{font:900 1.25rem/1 var(--display);font-stretch:125%;letter-spacing:.01em}
.out{font:900 1.25rem/1 var(--outline);color:transparent;-webkit-text-stroke:1.2px var(--paper)}
.rule{flex:1;height:1.5px;min-width:1rem;background:var(--paper)}
.five{font:300 1.25rem/1 var(--text)}

.jnnh{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;--lh:min(39svh,58vw)}
.jr{display:flex;justify-content:center}
.L{display:block;height:var(--lh);width:auto;will-change:transform,opacity}

.dialwrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.dialwrap::before{content:"";position:absolute;width:min(96vw,68svh);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(closest-side,rgba(11,21,48,.5),rgba(11,21,48,.3) 72%,transparent)}
#dial{position:relative;display:block;width:min(86vw,60svh);height:auto}

.copy{position:absolute;z-index:3;left:var(--pad);right:var(--pad);top:calc(max(2.4svh,env(safe-area-inset-top)) + 3.4rem);
  max-width:19ch;font:400 clamp(1.15rem,3.8vw,1.5rem)/1.35 var(--text);text-shadow:0 1px 16px rgba(11,21,48,.75)}
.c2,.c3{display:none}
.motion .c2,.motion .c3{display:block}
@media (min-aspect-ratio:1/1){.copy{top:40svh;max-width:15ch;font-size:clamp(1.3rem,2.1vw,2.1rem)}}

.strip{position:absolute;z-index:3;left:var(--pad);right:var(--pad);bottom:max(2.4svh,env(safe-area-inset-bottom));
  display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}
.date b,.date i{display:block;font:900 clamp(1.5rem,6.4vw,2.4rem)/.92 var(--display);font-stretch:125%;font-style:normal;text-transform:capitalize}
.date i{font-family:var(--outline);font-stretch:normal;color:transparent;-webkit-text-stroke:1.2px var(--paper)}
.now{text-align:right;min-width:0}
.now .ar{font:300 clamp(2rem,9vw,3.4rem)/1.1 var(--ar)}
.now .nm{font:600 .95rem/1.2 var(--text)}
.now .win{display:flex;align-items:center;gap:.6rem;margin-top:.45rem;font:300 .85rem/1 var(--text)}
.now .win u{flex:1;height:1.5px;min-width:2.4rem;background:currentColor}
.now .left{margin-top:.4rem;font:300 .85rem/1.2 var(--text);opacity:.85}

/* ── Uhr (SVG) ── */
#dial .rim{fill:none;stroke:var(--paper);stroke-opacity:.6;stroke-width:1.1}
#dial .tick{stroke:var(--paper);stroke-opacity:.5;stroke-width:1.1}
#dial .tick.big{stroke-opacity:.95;stroke-width:1.5}
#dial .win{fill:none;stroke:var(--paper);stroke-opacity:.32;stroke-width:2.6;stroke-dasharray:1;transition:stroke-opacity .6s,stroke-width .6s}
#dial .win.on{stroke-opacity:1;stroke-width:4}
#dial .nm{font:300 25px var(--ar);fill:var(--paper-hi);fill-opacity:.72;transition:fill-opacity .6s}
#dial .nm.on{fill-opacity:1;font-weight:500}
#dial .h,#dial .m,#dial .s{stroke:var(--paper-hi);stroke-linecap:round}
#dial .h{stroke-width:2.8}
#dial .m{stroke-width:1.8}
#dial .s{stroke-width:.9;stroke-opacity:.9}
#dial .cap{fill:var(--night);stroke:var(--paper-hi);stroke-width:1.4}

/* ── Mit Motion (fx.js setzt html.motion) ── */
.motion .copy{max-width:19ch}
@media (min-aspect-ratio:1/1){.motion .copy{max-width:15ch}}

/* ── App-Bereich: Text in Papierweiß direkt auf dem Video ── */
.sec{position:relative;min-height:100svh;padding:16svh var(--pad) 14svh}
.wrap{max-width:46rem;margin-inline:auto}
.sec h2{font:900 clamp(2.8rem,13vw,6.5rem)/.9 var(--display);font-stretch:125%;letter-spacing:-.01em;margin-bottom:2rem;text-shadow:0 2px 24px rgba(11,21,48,.55)}
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem;margin-bottom:2rem}
.head h2{margin:0}
.rows{list-style:none;padding:0}
.row{display:grid;grid-template-columns:5rem 1fr auto;gap:.5rem 1rem;align-items:center;padding:1.2rem 0;border-top:1.5px solid rgba(232,218,195,.4)}
.row:last-child{border-bottom:1.5px solid rgba(232,218,195,.4)}
.row .ar{font:300 1.9rem/1 var(--ar)}
.row .nm{font:600 1.05rem/1.25 var(--text)}
.row small{display:block;font:300 .85rem/1.4 var(--text);opacity:.8}
.row .st{font:300 .9rem/1.3 var(--text);text-align:right;opacity:.85}
.row.live .st{font-weight:600;opacity:1}
.row .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.7rem}
.row img{grid-column:1/-1;width:100%}
.row.muted{display:block;opacity:.8}
.pl{font:900 2.4rem/1 var(--display);font-stretch:125%}
#board .row:not(:first-child) .pl{font-family:var(--outline);font-stretch:normal;color:transparent;-webkit-text-stroke:1.2px var(--paper)}
.pt{font:900 1.6rem/1 var(--display);font-stretch:125%;font-variant-numeric:tabular-nums}
.big{font:900 clamp(2.4rem,10vw,4.2rem)/1 var(--display);font-stretch:125%;margin-bottom:.6rem}
.plain{list-style:none;padding:0;margin-top:.8rem;opacity:.8;font-size:.95rem}
#me p{margin-bottom:.3rem}

button,.btn{min-height:46px;padding:.6em 1.4em;border:1.5px solid currentColor;border-radius:0;background:none;color:inherit;
  font:400 .95rem/1 var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin:0}
button.solid{background:url(assets/img/ink.webp) 0 0/384px 384px;border-color:transparent;color:var(--paper-hi);font-weight:600}
button.ghost{border-color:transparent;text-decoration:underline;text-underline-offset:.3em;padding-inline:.2em}
button:disabled{opacity:.4;cursor:default}
label{display:grid;gap:.3rem;margin:1rem 0;font-size:.95rem}
label.btn{display:inline-flex;margin:0}
input,select{min-height:46px;padding:.4em .1em;border:0;border-bottom:1.5px solid currentColor;background:none;border-radius:0}
select option{color:var(--night);background:var(--paper)}
.settings{margin-top:1.6rem}
.btns{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.4rem}
#auth-msg{margin-top:.8rem;min-height:1.6em}

/* ── Hinweis und Dialoge: Papierbogen mit blauer Schrift ── */
#toast{position:fixed;left:50%;bottom:max(1.2rem,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,28rem);
  padding:.85rem 1.3rem;background:var(--ink-deep);color:var(--paper-hi);border:1.5px solid var(--paper);text-align:center;font-size:.95rem;z-index:50}
dialog{margin:auto;width:min(92vw,26rem);max-height:92svh;overflow:auto;border:0;border-radius:0;padding:1.8rem;
  background:url(assets/img/paper.webp) 0 0/256px 256px;color:var(--ink-deep)}
dialog::backdrop{background:rgba(11,21,48,.82)}
dialog h3{font:900 1.9rem/1 var(--display);font-stretch:125%;color:var(--ink);margin-bottom:.8rem}
dialog img{display:block;width:100%;margin:.9rem 0}
dialog .rows .row{border-color:rgba(27,51,111,.4)}
dialog .rows .row:last-child{border-bottom-color:rgba(27,51,111,.4)}
dialog button.solid{color:var(--paper-hi)}
.sh-actions{display:grid;gap:.7rem;margin-top:1.1rem}

@media (prefers-reduced-motion:reduce){.bg video,.veil{transition:none}}
</style>
</head>
<body>

<!-- Hintergrund: vier Videos, fx.js blendet je Abschnitt eines ein; ohne Autoplay bleibt das Poster stehen -->
<div class="bg" aria-hidden="true">
  <video id="v0" muted loop playsinline preload="auto" poster="assets/video/night.jpg"><source src="assets/video/night.mp4" type="video/mp4"><source src="assets/video/night.webm" type="video/webm"></video>
  <video id="v1" muted loop playsinline preload="none" poster="assets/video/mosque.jpg"><source src="assets/video/mosque.mp4" type="video/mp4"><source src="assets/video/mosque.webm" type="video/webm"></video>
  <video id="v2" muted loop playsinline preload="none" poster="assets/video/sunset.jpg"><source src="assets/video/sunset.mp4" type="video/mp4"><source src="assets/video/sunset.webm" type="video/webm"></video>
  <video id="v3" muted loop playsinline preload="none" poster="assets/video/clouds.jpg"><source src="assets/video/clouds.mp4" type="video/mp4"><source src="assets/video/clouds.webm" type="video/webm"></video>
</div>
<div class="veil" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div id="smooth-wrapper"><div id="smooth-content">

  <!-- Bühne -->
  <section class="hero" aria-label="JNNH">
    <h1 class="sr">JNNH</h1>

    <header class="bar" aria-hidden="true"><span class="mark">JNNH</span><span class="out">Gebet</span><i class="rule"></i><span class="five">5</span></header>

    <div class="jnnh" aria-hidden="true">
      <div class="jr"><img class="L Lj" src="assets/img/L-J.webp" width="591" height="852" alt=""><img class="L Ln1" src="assets/img/L-N.webp" width="732" height="852" alt=""></div>
      <div class="jr"><img class="L Ln2" src="assets/img/L-N.webp" width="732" height="852" alt=""><img class="L Lh" src="assets/img/L-H.webp" width="600" height="852" alt=""></div>
    </div>

    <div class="dialwrap" aria-hidden="true"><svg id="dial" xmlns="http://www.w3.org/2000/svg"></svg></div>

    <p class="copy c1">Diese Uhr hat keine Zahlen. Die fünf Gebete sitzen dort, wo sie wirklich beginnen.</p>
    <p class="copy c2">Pünktlich in den ersten fünf Minuten: 100 Punkte. In der Moschee: 450.</p>
    <p class="copy c3">Vier Freunde, eine Rangliste, ein Wettstreit im Guten.</p>

    <footer class="strip">
      <div class="date" aria-hidden="true"><b id="s-d1"></b><i id="s-d2"></i><b id="s-d3"></b></div>
      <div class="now">
        <div class="ar" id="s-ar" lang="ar"></div>
        <div class="nm"><span id="s-nm"></span>, <span id="s-st"></span></div>
        <div class="win" id="s-win"></div>
        <div class="left" id="next"></div>
      </div>
    </footer>
  </section>

  <!-- App-Bereich: jeder Abschnitt gehört zu einer Video-Szene (data-scene) -->
  <main id="app">
    <section id="auth" class="sec" hidden><div class="wrap">
      <h2 data-speed="0.94">Anmelden</h2>
      <form id="login">
        <label>E-Mail<input type="email" name="email" autocomplete="username" required></label>
        <label>Passwort<input type="password" name="pw" autocomplete="current-password" required></label>
        <button class="solid">Anmelden</button>
        <p id="auth-msg" role="alert"></p>
      </form>
    </div></section>

    <div id="main">
      <section class="sec" data-scene="1"><div class="wrap">
        <div class="head"><h2 data-speed="0.94">Heute</h2><button id="locate" class="ghost" type="button">Standort freigeben</button></div>
        <ol id="today" class="rows"></ol>
      </div></section>

      <section class="sec" data-scene="2"><div class="wrap">
        <h2 data-speed="0.94">Rangliste</h2>
        <ol id="board" class="rows"></ol>
      </div></section>

      <section class="sec" data-scene="3"><div class="wrap">
        <h2 data-speed="0.94">Profil</h2>
        <div id="me"></div>
        <div class="settings">
          <label>Asr-Berechnung
            <select id="school"><option value="">Standard der API</option><option value="0">Shafi, Maliki, Hanbali</option><option value="1">Hanafi</option></select>
          </label>
          <label>Berechnungsmethode
            <select id="method"><option value="">Standard der API</option><option value="3">Muslim World League</option><option value="2">ISNA</option><option value="4">Umm al-Qura</option><option value="13">Diyanet</option><option value="1">Karachi</option></select>
          </label>
          <div class="btns">
            <button id="set-mosque" class="solid" type="button">Moschee hier speichern</button>
            <button id="logout" class="ghost" type="button" hidden>Abmelden</button>
          </div>
        </div>
      </div></section>
    </div>
  </main>

</div></div>

<!-- außerhalb des Smoothers, damit nichts durch dessen Transform verrutscht -->
<p id="toast" role="status" hidden></p>

<dialog id="sheet" aria-labelledby="sh-title">
  <h3 id="sh-title"></h3>
  <p id="sh-text" role="status"></p>
  <img id="sh-img" alt="Foto deines Gebetsteppichs" hidden>
  <div class="sh-actions">
    <label class="btn">Teppich fotografieren<input id="sh-photo" type="file" accept="image/*" capture="environment" hidden></label>
    <button id="sh-go" class="solid" type="button" disabled>Handy weglegen und beten</button>
    <button id="sh-cancel" class="ghost" type="button">Abbrechen</button>
  </div>
</dialog>

<dialog id="friend" aria-labelledby="fr-name">
  <h3 id="fr-name"></h3>
  <ol id="fr-list" class="rows"></ol>
  <div class="sh-actions"><button id="fr-close" class="ghost" type="button">Schließen</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollSmoother.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
